name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./... -v -cover

      - name: Build binary
        run: go build -o mdflag ./cmd/mdflag/

      - name: Run integration tests
        run: |
          chmod +x scripts/integration_test.sh
          ./scripts/integration_test.sh

      - name: Run MCP tests
        run: |
          chmod +x scripts/test_mcp.sh
          ./scripts/test_mcp.sh

      - name: Run benchmark tests
        run: |
          chmod +x scripts/benchmark_test.sh
          ./scripts/benchmark_test.sh

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: mdflag-linux-amd64
          - goos: linux
            goarch: arm64
            output: mdflag-linux-arm64
          - goos: darwin
            goarch: amd64
            output: mdflag-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: mdflag-darwin-arm64
          - goos: windows
            goarch: amd64
            output: mdflag-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/mdflag/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          cd release
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
